# ==============================================================================
# Agent-Forge Unified Docker Compose Stack
#
# Services:
#  - forgejo: internal Git server for worker branches and pull requests
#  - egress-proxy: Squid proxy restricting workers to allowlisted destinations
#  - dashboard: Agent-Forge web management console and status monitor
# ==============================================================================
name: agent-forge

networks:
  workers_internal:
    name: workers_internal
    internal: true
    ipam:
      config:
        - subnet: 172.29.250.0/24
  egress_out:
    name: egress_out
  forgejo_net:
    name: forgejo_net

volumes:
  forgejo-data:
    name: agent-forge_forgejo-data
  egress-logs:
    name: agent-forge_egress-logs

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.5-rootless
    container_name: ${FORGE_CONTAINER:-agent-forge-forgejo}
    user: "1000:1000"
    restart: unless-stopped
    networks:
      - forgejo_net
      - workers_internal
    environment:
      - FORGEJO__server__DOMAIN=localhost
      - FORGEJO__server__ROOT_URL=http://localhost:${FORGE_HTTP_PORT:-3000}/
      - FORGEJO__server__SSH_DOMAIN=localhost
      - FORGEJO__server__SSH_PORT=${FORGE_SSH_PORT:-2222}
      - FORGEJO__server__START_SSH_SERVER=true
      - FORGEJO__server__SSH_LISTEN_PORT=2222
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__database__DB_TYPE=sqlite3
    volumes:
      - forgejo-data:/var/lib/gitea
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:${FORGE_HTTP_PORT:-3000}:3000"
      - "127.0.0.1:${FORGE_SSH_PORT:-2222}:2222"

  egress-proxy:
    build:
      context: ./egress
      dockerfile: Dockerfile
    image: sandbox-egress-proxy:7.2
    container_name: ${EGRESS_CONTAINER:-agent-forge-egress-proxy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1
    mem_limit: 512m
    environment:
      - EGRESS_MODE=${EGRESS_MODE:-enforce}
    networks:
      - workers_internal
      - egress_out
    volumes:
      - egress-logs:/var/log/squid
      - ./egress/allowlist.txt:/etc/squid/allowlist.txt:ro
      - ./egress/allowlist.local.txt:/etc/squid/allowlist.local.txt:ro
      - ./egress/local-endpoint.conf:/etc/squid/local-endpoint.conf:ro
    tmpfs:
      - /tmp
      - /var/spool/squid

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-forge-dashboard:latest
    container_name: ${DASHBOARD_CONTAINER:-agent-forge-dashboard}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND_IP:-127.0.0.1}:${DASHBOARD_PORT:-8171}:8171"
    environment:
      - BIND_HOST=0.0.0.0
      - BIND_PORT=8171
      - DASHBOARD_HOSTS=${DASHBOARD_HOSTS:-localhost,127.0.0.1}
      - DASHBOARD_TOKEN=${DASHBOARD_TOKEN:-}
      - DEMO_MODE=${DEMO_MODE:-0}
    networks:
      - egress_out
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8171/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
