<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d"><title id="t">Agent-Forge in four numbers</title><desc id="d">Merged tasks, throughput with parallel workers, token saving per merged task and the share of first attempts sent back, with the limits of the sample.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grid:#d1d9e0;--base:#9aa4af;--a:#0969da;--good:#1a7f37;--bad:#cf222e;--neu:#59636e;--c:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--grid:#30363d;--base:#6e7681;--a:#4493f8;--good:#3fb950;--bad:#f85149;--neu:#9198a1;--c:#a371f7}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:17px;font-weight:600}.s{fill:var(--mut);font-size:12px}.l{fill:var(--mut)}.v{font-weight:600}.h{font-size:13px;font-weight:600}.b{font-size:34px;font-weight:700}
</style><rect width="760" height="336" fill="var(--bg)"/><text x="24" y="32" class="t" text-anchor="start">Agent-Forge on real work, in four numbers</text><text x="24" y="52" class="s" text-anchor="start">One self-hosted install, 2026-10-02 to 2026-10-20. Every number is computed from the committed data.</text><line x1="24.0" y1="74.0" x2="192.0" y2="74.0" stroke="var(--a)" stroke-width="1.5"/><text x="24" y="120" class="b" text-anchor="start">783</text><text x="24" y="144" class="l" text-anchor="start">tasks merged through the</text><text x="24" y="160" class="l" text-anchor="start">gate: 221 on Agent-Forge</text><text x="24" y="176" class="l" text-anchor="start">itself, 562 on a private</text><text x="24" y="192" class="l" text-anchor="start">app</text><line x1="205.0" y1="74.0" x2="373.0" y2="74.0" stroke="var(--a)" stroke-width="1.5"/><text x="205" y="120" class="b" text-anchor="start">3.1x</text><text x="205" y="144" class="l" text-anchor="start">more finished runs per hour</text><text x="205" y="160" class="l" text-anchor="start">with about 6 workers than</text><text x="205" y="176" class="l" text-anchor="start">with one</text><line x1="386.0" y1="74.0" x2="554.0" y2="74.0" stroke="var(--a)" stroke-width="1.5"/><text x="386" y="120" class="b" text-anchor="start">-57%</text><text x="386" y="144" class="l" text-anchor="start">tokens per merged task</text><text x="386" y="160" class="l" text-anchor="start">after the 0.9.0 features</text><text x="386" y="176" class="l" text-anchor="start">(median, before/after)</text><line x1="567.0" y1="74.0" x2="735.0" y2="74.0" stroke="var(--a)" stroke-width="1.5"/><text x="567" y="120" class="b" text-anchor="start">34-42%</text><text x="567" y="144" class="l" text-anchor="start">of first attempts were sent</text><text x="567" y="160" class="l" text-anchor="start">back by the gate or the</text><text x="567" y="176" class="l" text-anchor="start">reviewer before merging</text><text x="24" y="238" class="h" text-anchor="start">The other side</text><text x="24" y="256" class="s" text-anchor="start">24% of Agent-Forge's own tasks were cancelled and took 23% of its tokens. Runs get slower and time</text><text x="24" y="273" class="s" text-anchor="start">out more when many workers share one machine.</text><text x="24" y="295" class="s" text-anchor="start">One install, one operator (the author), one worker model. No comparison with a human, a single agent</text><text x="24" y="312" class="s" text-anchor="start">without the loop, or another tool. Merged is not proven correct.</text></svg>
