<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" width="760" height="445" role="img" aria-labelledby="t d"><title id="t">Context pack: tasks assigned at random</title><desc id="d">Randomised comparison of tasks with and without the context pack: tokens, tool calls, first pass and reworks per merged task.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grid:#d1d9e0;--base:#9aa4af;--a:#0969da;--good:#1a7f37;--bad:#cf222e;--neu:#59636e;--c:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--grid:#30363d;--base:#6e7681;--a:#4493f8;--good:#3fb950;--bad:#f85149;--neu:#9198a1;--c:#a371f7}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:17px;font-weight:600}.s{fill:var(--mut);font-size:12px}.l{fill:var(--mut)}.v{font-weight:600}.h{font-size:13px;font-weight:600}.b{font-size:34px;font-weight:700}
</style><rect width="760" height="445" fill="var(--bg)"/><text x="24" y="32" class="t" text-anchor="start">Context pack: tasks assigned at random</text><text x="24" y="52" class="s" text-anchor="start">Agent-Forge's own project, 221 merged tasks; about half got the code-map context pack.</text><text x="24" y="84" class="h" text-anchor="start">Tokens per merged task (median)</text><text x="736" y="84" class="s" text-anchor="end">p = 0.016</text><text x="24" y="106" class="l" text-anchor="start">no pack</text><rect x="190.0" y="92.0" width="340.0" height="18" rx="2" fill="var(--base)"/><text x="538" y="106" class="v" text-anchor="start">559k</text><text x="24" y="130" class="l" text-anchor="start">with pack</text><rect x="190.0" y="116.0" width="247.1" height="18" rx="2" fill="var(--good)"/><text x="445" y="130" class="v" text-anchor="start">406k</text><text x="24" y="168" class="h" text-anchor="start">Tool calls per merged task (median)</text><text x="736" y="168" class="s" text-anchor="end">p = 0.054 (borderline)</text><text x="24" y="190" class="l" text-anchor="start">no pack</text><rect x="190.0" y="176.0" width="340.0" height="18" rx="2" fill="var(--base)"/><text x="538" y="190" class="v" text-anchor="start">86</text><text x="24" y="214" class="l" text-anchor="start">with pack</text><rect x="190.0" y="200.0" width="284.7" height="18" rx="2" fill="var(--neu)"/><text x="483" y="214" class="v" text-anchor="start">72</text><text x="24" y="252" class="h" text-anchor="start">Merged with no rework (first pass)</text><text x="736" y="252" class="s" text-anchor="end">p = 0.275, interval includes 0</text><text x="24" y="274" class="l" text-anchor="start">no pack</text><rect x="190.0" y="260.0" width="296.1" height="18" rx="2" fill="var(--base)"/><text x="494" y="274" class="v" text-anchor="start">54%</text><text x="24" y="298" class="l" text-anchor="start">with pack</text><rect x="190.0" y="284.0" width="340.0" height="18" rx="2" fill="var(--neu)"/><text x="538" y="298" class="v" text-anchor="start">62%</text><text x="24" y="336" class="h" text-anchor="start">Reworks per merged task (mean)</text><text x="736" y="336" class="s" text-anchor="end">p = 0.971</text><text x="24" y="358" class="l" text-anchor="start">no pack</text><rect x="190.0" y="344.0" width="340.0" height="18" rx="2" fill="var(--base)"/><text x="538" y="358" class="v" text-anchor="start">0.9</text><text x="24" y="382" class="l" text-anchor="start">with pack</text><rect x="190.0" y="368.0" width="336.2" height="18" rx="2" fill="var(--neu)"/><text x="534" y="382" class="v" text-anchor="start">0.89</text><text x="24" y="420" class="s" text-anchor="start">Green = the difference is unlikely to be chance (p &lt; 0.05). Grey = could be chance.</text></svg>
