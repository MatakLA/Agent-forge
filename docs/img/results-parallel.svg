<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 482" width="760" height="482" role="img" aria-labelledby="t d"><title id="t">Throughput by number of workers running at once</title><desc id="d">Runs that ended ok per hour for the whole team, with 1, 2, 3-4 and 5-8 workers running at the start of a run, and how long a run takes.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grid:#d1d9e0;--base:#9aa4af;--a:#0969da;--good:#1a7f37;--bad:#cf222e;--neu:#59636e;--c:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--grid:#30363d;--base:#6e7681;--a:#4493f8;--good:#3fb950;--bad:#f85149;--neu:#9198a1;--c:#a371f7}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:17px;font-weight:600}.s{fill:var(--mut);font-size:12px}.l{fill:var(--mut)}.v{font-weight:600}.h{font-size:13px;font-weight:600}.b{font-size:34px;font-weight:700}
</style><rect width="760" height="482" fill="var(--bg)"/><text x="24" y="32" class="t" text-anchor="start">More workers: more work done, but far from linear</text><text x="24" y="52" class="s" text-anchor="start">1927 executed runs, 2026-09-26 to 2026-10-20. Dashed line = what perfect scaling from one worker</text><text x="24" y="69" class="s" text-anchor="start">would give.</text><text x="24" y="88" class="h" text-anchor="start">Runs that ended ok per hour, whole team</text><text x="24" y="112" class="l" text-anchor="start">1 worker</text><rect x="214.0" y="98.0" width="60.1" height="20" rx="2" fill="var(--a)"/><text x="282" y="112" class="v" text-anchor="start">3.3/h  = 1.0x</text><text x="24" y="142" class="l" text-anchor="start">2 workers (avg 2)</text><rect x="214.0" y="128.0" width="95.1" height="20" rx="2" fill="var(--a)"/><line x1="334.2" y1="125.0" x2="334.2" y2="151.0" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="342" y="142" class="v" text-anchor="start">5.3/h  = 1.6x</text><text x="24" y="172" class="l" text-anchor="start">3-4 workers (avg 3.6)</text><rect x="214.0" y="158.0" width="137.0" height="20" rx="2" fill="var(--a)"/><line x1="430.3" y1="155.0" x2="430.3" y2="181.0" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="438" y="172" class="v" text-anchor="start">7.6/h  = 2.3x</text><text x="24" y="202" class="l" text-anchor="start">5-8 workers (avg 6.2)</text><rect x="214.0" y="188.0" width="188.7" height="20" rx="2" fill="var(--a)"/><line x1="586.5" y1="185.0" x2="586.5" y2="211.0" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="595" y="202" class="v" text-anchor="start">10.5/h  = 3.1x</text><text x="24" y="244" class="h" text-anchor="start">Mean minutes per run (one machine, one model account)</text><text x="24" y="268" class="l" text-anchor="start">1 worker</text><rect x="214.0" y="254.0" width="146.1" height="20" rx="2" fill="var(--base)"/><text x="368" y="268" class="v" text-anchor="start">14 min,  10% hit the time limit</text><text x="24" y="298" class="l" text-anchor="start">2 workers</text><rect x="214.0" y="284.0" width="168.5" height="20" rx="2" fill="var(--bad)"/><text x="391" y="298" class="v" text-anchor="start">16 min,  12% hit the time limit</text><text x="24" y="328" class="l" text-anchor="start">3-4 workers</text><rect x="214.0" y="314.0" width="211.2" height="20" rx="2" fill="var(--bad)"/><text x="433" y="328" class="v" text-anchor="start">20 min,  18% hit the time limit</text><text x="24" y="358" class="l" text-anchor="start">5-8 workers</text><rect x="214.0" y="344.0" width="254.9" height="20" rx="2" fill="var(--bad)"/><text x="477" y="358" class="v" text-anchor="start">24 min,  24% hit the time limit</text><text x="24" y="398" class="s" text-anchor="start">Same 1927 runs one after another: 441-612 h of work, done in 220 h with work running = 2.0-2.8x less</text><text x="24" y="415" class="s" text-anchor="start">calendar time, same tokens.</text><text x="24" y="440" class="s" text-anchor="start">Groups are not randomised: heavy periods also had harder tasks and a busier machine. Read the trend,</text><text x="24" y="457" class="s" text-anchor="start">not the third digit.</text></svg>
