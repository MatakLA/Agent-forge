<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 456" width="760" height="456" role="img" aria-labelledby="t d"><title id="t">Benchmark: one task, four prompt versions</title><desc id="d">Tokens and tool calls of one worker run per prompt version (the same small task, model and worker).</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grid:#d1d9e0;--base:#9aa4af;--a:#0969da;--good:#1a7f37;--bad:#cf222e;--neu:#59636e;--c:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--grid:#30363d;--base:#6e7681;--a:#4493f8;--good:#3fb950;--bad:#f85149;--neu:#9198a1;--c:#a371f7}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:17px;font-weight:600}.s{fill:var(--mut);font-size:12px}.l{fill:var(--mut)}.v{font-weight:600}.h{font-size:13px;font-weight:600}.b{font-size:34px;font-weight:700}
</style><rect width="760" height="456" fill="var(--bg)"/><text x="24" y="32" class="t" text-anchor="start">Prompt versions on the same task: one run each</text><text x="24" y="52" class="s" text-anchor="start">Every run shown passed its checks. One run per version, so differences of this size are noise.</text><text x="24" y="88" class="h" text-anchor="start">Tokens</text><text x="24" y="112" class="l" text-anchor="start">v4  save-tokens rules, read hints</text><rect x="274.0" y="98.0" width="279.6" height="20" rx="2" fill="var(--a)"/><text x="562" y="112" class="v" text-anchor="start">96.7k</text><text x="24" y="142" class="l" text-anchor="start">v6  + spans, callers, start state</text><rect x="274.0" y="128.0" width="333.3" height="20" rx="2" fill="var(--a)"/><text x="615" y="142" class="v" text-anchor="start">115.3k</text><text x="24" y="172" class="l" text-anchor="start">v7  v6 + cache-friendly order</text><rect x="274.0" y="158.0" width="267.7" height="20" rx="2" fill="var(--a)"/><text x="550" y="172" class="v" text-anchor="start">92.6k</text><text x="24" y="202" class="l" text-anchor="start">v8  batching rule only</text><rect x="274.0" y="188.0" width="264.4" height="20" rx="2" fill="var(--a)"/><text x="546" y="202" class="v" text-anchor="start">91.5k</text><text x="24" y="244" class="h" text-anchor="start">Tool calls</text><text x="24" y="268" class="l" text-anchor="start">v4  save-tokens rules, read hints</text><rect x="274.0" y="254.0" width="250.0" height="20" rx="2" fill="var(--a)"/><text x="532" y="268" class="v" text-anchor="start">24</text><text x="24" y="298" class="l" text-anchor="start">v6  + spans, callers, start state</text><rect x="274.0" y="284.0" width="333.3" height="20" rx="2" fill="var(--a)"/><text x="615" y="298" class="v" text-anchor="start">32</text><text x="24" y="328" class="l" text-anchor="start">v7  v6 + cache-friendly order</text><rect x="274.0" y="314.0" width="239.6" height="20" rx="2" fill="var(--a)"/><text x="522" y="328" class="v" text-anchor="start">23</text><text x="24" y="358" class="l" text-anchor="start">v8  batching rule only</text><rect x="274.0" y="344.0" width="250.0" height="20" rx="2" fill="var(--a)"/><text x="532" y="358" class="v" text-anchor="start">24</text><text x="24" y="398" class="s" text-anchor="start">No version is proven better. A run costs about 7% of one account's weekly quota, so repeats are slow</text><text x="24" y="415" class="s" text-anchor="start">to buy. The first release (v0) hit the time limit and is left out.</text></svg>
