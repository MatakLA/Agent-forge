<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" width="760" height="546" role="img" aria-labelledby="t d"><title id="t">What the 0.9.0 efficiency features did</title><desc id="d">Before and after bars for tokens per merged task, token-cap stops, first-pass rate, time-limit stops and minutes per run.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grid:#d1d9e0;--base:#9aa4af;--a:#0969da;--good:#1a7f37;--bad:#cf222e;--neu:#59636e;--c:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--grid:#30363d;--base:#6e7681;--a:#4493f8;--good:#3fb950;--bad:#f85149;--neu:#9198a1;--c:#a371f7}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:17px;font-weight:600}.s{fill:var(--mut);font-size:12px}.l{fill:var(--mut)}.v{font-weight:600}.h{font-size:13px;font-weight:600}.b{font-size:34px;font-weight:700}
</style><rect width="760" height="546" fill="var(--bg)"/><text x="24" y="32" class="t" text-anchor="start">What the 0.9.0 efficiency features did</text><text x="24" y="52" class="s" text-anchor="start">Before / after on one project, cut 2026-10-07: 164 merged tasks before, 398 after. Not randomised.</text><text x="24" y="84" class="h" text-anchor="start">Tokens per merged task (median)</text><text x="736" y="84" class="s" text-anchor="end">interval excludes zero</text><text x="24" y="106" class="l" text-anchor="start">before</text><rect x="190.0" y="92.0" width="340.0" height="18" rx="2" fill="var(--base)"/><text x="538" y="106" class="v" text-anchor="start">1.08M</text><text x="24" y="130" class="l" text-anchor="start">after</text><rect x="190.0" y="116.0" width="147.0" height="18" rx="2" fill="var(--good)"/><text x="345" y="130" class="v" text-anchor="start">466k</text><text x="24" y="168" class="h" text-anchor="start">Runs stopped by the token cap</text><text x="736" y="168" class="s" text-anchor="end">22% to 0%</text><text x="24" y="190" class="l" text-anchor="start">before</text><rect x="190.0" y="176.0" width="340.0" height="18" rx="2" fill="var(--base)"/><text x="538" y="190" class="v" text-anchor="start">22.2%</text><text x="24" y="214" class="l" text-anchor="start">after</text><rect x="190.0" y="200.0" width="3.1" height="18" rx="2" fill="var(--good)"/><text x="201" y="214" class="v" text-anchor="start">0.2%</text><text x="24" y="252" class="h" text-anchor="start">Merged with no rework (first pass)</text><text x="736" y="252" class="s" text-anchor="end">no change</text><text x="24" y="274" class="l" text-anchor="start">before</text><rect x="190.0" y="260.0" width="340.0" height="18" rx="2" fill="var(--base)"/><text x="538" y="274" class="v" text-anchor="start">67%</text><text x="24" y="298" class="l" text-anchor="start">after</text><rect x="190.0" y="284.0" width="334.9" height="18" rx="2" fill="var(--neu)"/><text x="533" y="298" class="v" text-anchor="start">66%</text><text x="24" y="336" class="h" text-anchor="start">Runs stopped by the time limit</text><text x="736" y="336" class="s" text-anchor="end">got worse</text><text x="24" y="358" class="l" text-anchor="start">before</text><rect x="190.0" y="344.0" width="39.3" height="18" rx="2" fill="var(--base)"/><text x="237" y="358" class="v" text-anchor="start">3.4%</text><text x="24" y="382" class="l" text-anchor="start">after</text><rect x="190.0" y="368.0" width="340.0" height="18" rx="2" fill="var(--bad)"/><text x="538" y="382" class="v" text-anchor="start">29.4%</text><text x="24" y="420" class="h" text-anchor="start">Median minutes per run</text><text x="736" y="420" class="s" text-anchor="end">got worse</text><text x="24" y="442" class="l" text-anchor="start">before</text><rect x="190.0" y="428.0" width="160.8" height="18" rx="2" fill="var(--base)"/><text x="359" y="442" class="v" text-anchor="start">12.2 min</text><text x="24" y="466" class="l" text-anchor="start">after</text><rect x="190.0" y="452.0" width="340.0" height="18" rx="2" fill="var(--bad)"/><text x="538" y="466" class="v" text-anchor="start">25.8 min</text><text x="24" y="504" class="s" text-anchor="start">Half the tokens and the same first-pass rate, but runs got twice as long and many more end at the</text><text x="24" y="521" class="s" text-anchor="start">time limit. Both are real.</text></svg>
