<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 494" width="760" height="494" role="img" aria-labelledby="t d"><title id="t">What the gate and the reviewer sent back</title><desc id="d">Bar chart of the reasons a worker's branch was sent back before it was merged, on Agent-Forge's own 221 merged tasks.</desc><style>
:root{--bg:#ffffff;--fg:#1f2328;--mut:#59636e;--grid:#d1d9e0;--base:#9aa4af;--a:#0969da;--good:#1a7f37;--bad:#cf222e;--neu:#59636e;--c:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--fg:#e6edf3;--mut:#9198a1;--grid:#30363d;--base:#6e7681;--a:#4493f8;--good:#3fb950;--bad:#f85149;--neu:#9198a1;--c:#a371f7}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);font-size:13px}
.t{font-size:17px;font-weight:600}.s{fill:var(--mut);font-size:12px}.l{fill:var(--mut)}.v{font-weight:600}.h{font-size:13px;font-weight:600}.b{font-size:34px;font-weight:700}
</style><rect width="760" height="494" fill="var(--bg)"/><text x="24" y="32" class="t" text-anchor="start">129 of 221 passed first time; 92 were sent back 198 times</text><text x="24" y="52" class="s" text-anchor="start">Reasons for send-backs on the 221 merged tasks of Agent-Forge's own development (2026-10-11 to</text><text x="24" y="69" class="s" text-anchor="start">10-16). One task can be sent back more than once.</text><text x="24" y="94" class="l" text-anchor="start">Acceptance criterion not met</text><rect x="294.0" y="80.0" width="304.8" height="20" rx="2" fill="var(--c)"/><text x="607" y="94" class="v" text-anchor="start">49</text><text x="24" y="124" class="l" text-anchor="start">Reviewer repeats a gate warning</text><rect x="294.0" y="110.0" width="199.0" height="20" rx="2" fill="var(--c)"/><text x="501" y="124" class="v" text-anchor="start">32</text><text x="24" y="154" class="l" text-anchor="start">Merge conflict</text><rect x="294.0" y="140.0" width="199.0" height="20" rx="2" fill="var(--base)"/><text x="501" y="154" class="v" text-anchor="start">32</text><text x="24" y="184" class="l" text-anchor="start">Change outside the allowed files</text><rect x="294.0" y="170.0" width="186.6" height="20" rx="2" fill="var(--c)"/><text x="489" y="184" class="v" text-anchor="start">30</text><text x="24" y="214" class="l" text-anchor="start">Tests missed planted bugs (mutation)</text><rect x="294.0" y="200.0" width="174.1" height="20" rx="2" fill="var(--a)"/><text x="476" y="214" class="v" text-anchor="start">28</text><text x="24" y="244" class="l" text-anchor="start">Branch not pushed</text><rect x="294.0" y="230.0" width="56.0" height="20" rx="2" fill="var(--base)"/><text x="358" y="244" class="v" text-anchor="start">9</text><text x="24" y="274" class="l" text-anchor="start">Secret-looking string (gate)</text><rect x="294.0" y="260.0" width="43.5" height="20" rx="2" fill="var(--a)"/><text x="346" y="274" class="v" text-anchor="start">7</text><text x="24" y="304" class="l" text-anchor="start">Other reviewer objection</text><rect x="294.0" y="290.0" width="37.3" height="20" rx="2" fill="var(--c)"/><text x="339" y="304" class="v" text-anchor="start">6</text><text x="24" y="334" class="l" text-anchor="start">Tests fail in a clean container</text><rect x="294.0" y="320.0" width="31.1" height="20" rx="2" fill="var(--a)"/><text x="333" y="334" class="v" text-anchor="start">5</text><rect x="24.0" y="364.0" width="12.0" height="12" rx="2" fill="var(--a)"/><text x="42" y="375" class="l" text-anchor="start">automatic checks</text><rect x="194.0" y="364.0" width="12.0" height="12" rx="2" fill="var(--c)"/><text x="212" y="375" class="l" text-anchor="start">AI reviewer</text><rect x="364.0" y="364.0" width="12.0" height="12" rx="2" fill="var(--base)"/><text x="382" y="375" class="l" text-anchor="start">mechanical</text><text x="24" y="402" class="s" text-anchor="start">Without the loop these branches would have gone to main as the worker left them. That experiment was</text><text x="24" y="419" class="s" text-anchor="start">not run. The reviewer is a model too, so some send-backs may have been needless; the cause is</text><text x="24" y="436" class="s" text-anchor="start">assigned by keyword matching and is approximate. The 78 send-backs on cancelled tasks are not</text><text x="24" y="453" class="s" text-anchor="start">counted.</text></svg>
