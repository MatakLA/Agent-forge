# bin/foreman settings - copy to etc/foreman.conf (KEY=VALUE, '#' comments). Every key is optional; these are the defaults.

# --- Who answers each orchestrator decision, tried left to right -------------------------------------------------------
# Free with subscriptions you already have:
#   claude-cli  - Claude Code (`claude -p`, your Claude subscription; logged in on this machine)
#   agy-claude  - Claude via Antigravity inside a worker container (that worker account's "Claude and GPT" quota)
#   agy-gemini  - Gemini via Antigravity inside a worker container (that worker account's Gemini quota)
# Paid per token (only if listed AND a key is configured, see docs/PROVIDERS.md): anthropic-api, openai-api, gemini-api
PLAN_PROVIDERS=claude-cli,agy-claude,agy-gemini
REVIEW_PROVIDERS=agy-claude,claude-cli
CLAUDE_MODEL=sonnet
AGY_PLAN_MODEL=claude-sonnet-4-6
AGY_REVIEW_MODEL=claude-sonnet-4-6
AGY_FALLBACK_MODEL=gemini-3.1-pro-high
# ANTHROPIC_MODEL=
# OPENAI_MODEL=
# OPENAI_API_BASE=https://api.openai.com/v1
# GEMINI_MODEL=

# --- The project -------------------------------------------------------------------------------------------------------
# Subdirectory of the repository the team works in ("" = the whole repo); its AGENTS.md is shown to the planner.
PROJECT_DIR=
# Your product vision, read by the planner, the autopilot and `bin/foreman project` (path relative to this directory).
VISION_FILE=docs/vision.md
# Language of goals, notes and questions written for you.
OWNER_LANG=English
LOCAL_TZ=UTC
# Files several tasks may edit at the same time (registries every task appends to); comma-separated.
SHARED_FILES=

# --- Pace and safety ---------------------------------------------------------------------------------------------------
# This project's worker pool (comma-separated container names; empty = every worker). Usually set per project in
# projects/<name>/project.conf so two orchestrators never share workers.
WORKERS=
# Risky tasks (money, security, dates) can use a stronger worker model; empty = WORKER_MODEL from etc/limits.conf.
WORKER_MODEL_RISKY=
# A rework on the same worker resumes the worker's own agy conversation (short prompt, no re-reading) when the previous run
# ended normally and used < 40 % of the token cap.
CONTINUE_CONVERSATIONS=1
# A task stopped by the token cap this many times is split by the planner into smaller tasks.
SPLIT_AFTER_CAPS=2
# Lessons from reworks kept in the prompts (etc/lessons.md or projects/<name>/lessons.md).
LESSONS_MAX=40
MAX_REWORK=3
MAX_GOAL_ROUNDS=3
MAX_ACTIVE_GOALS=8
TASK_TOKEN_BUDGET=600000
DIFF_MAX=60000
AUTO_MERGE=1
AUTOPILOT=1
LOOP_SEC=20

# --- Efficiency (docs/EFFICIENCY.md) -------------------------------------------------------------------------------------
# Context pack in every task: the current content of the task's own files, the interfaces of the modules they use and a
# one-line map of the rest, generated from main without any LLM - so the worker does not spend its first 20-30 tool calls
# reading. on | off | ab (half the tasks get it; compare in the dashboard's Metrics tab).
CONTEXT_PACK=on
CONTEXT_PACK_CHARS=60000
# Before a run ends, the supervisor runs the test suite in the worker's clone; if it fails, the worker fixes it in the same
# conversation (up to this many rounds) instead of a new attempt after the gate. 0 = off.
SELF_CHECK_ROUNDS=1
# Tasks that own more files than this (shared registries do not count) are split by the planner before anyone starts.
MAX_TASK_FILES=3
# Cheaper model for light roles, and an A/B test of another worker model on AB_SHARE % of routine tasks.
WORKER_MODEL_LIGHT=
LIGHT_ROLES=tester,technical-writer,translator
AB_MODEL=
AB_SHARE=0
# While every worker waits for its quota: plan backlog goals ahead (orchestrator only), and check main without any LLM
# (full suite 3x for a red main / flaky tests, modules without a docstring) - findings go to the goals/backlog.
PLAN_AHEAD=1
MAINTENANCE=1

# --- Your stack ----------------------------------------------------------------------------------------------------------
# How the project is tested - by the gate (fresh offline container), the workers' self-check and maintenance. Any language
# with a command-line test runner; a plain command line, no shell syntax. Empty = python3 -m pytest -q -p no:cacheprovider.
#   TEST_CMD=npm test --silent          TEST_CMD=go test ./...          TEST_CMD=cargo test --offline
TEST_CMD=
# Image the gate runs TEST_CMD in (it needs your toolchain and your dependencies - the gate is offline). Empty = the worker
# image (Python + pytest). Extend worker/Dockerfile or build your own FROM it; the workers need the same tools.
GATE_IMAGE=

# --- Notifications -------------------------------------------------------------------------------------------------------
# Where to tell you that a goal is done, a task is blocked, the kill switch tripped, the planner has questions or all
# workers are out of quota. An ntfy topic (https://ntfy.sh/<topic> or your own server), a Slack or Discord incoming
# webhook, or any endpoint that takes JSON. An optional access token goes into the secrets file `notify.token`.
NOTIFY_URL=
NOTIFY_FORMAT=ntfy
NOTIFY_EVENTS=goal_done,task_blocked,killswitch,questions,quota_out
# Finished runs older than this many days have their transcripts gzip-compressed by maintenance.
RUNS_KEEP_DAYS=14
