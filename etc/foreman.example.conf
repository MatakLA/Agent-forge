# ==============================================================================
# Foreman Configuration Template (etc/foreman.conf)
# Controls LLM providers, review parameters, parallelism, and loop intervals.
# ==============================================================================

# ------------------------------------------------------------------------------
# Orchestrator LLM Provider Settings
# ------------------------------------------------------------------------------
# Provider for planning, review, and autopilot:
# Options: auto | claude | openai | gemini
ORCHESTRATOR_PROVIDER=auto

# Primary models:
# Anthropic / Claude:
CLAUDE_MODEL=sonnet
ANTHROPIC_MODEL=claude-3-7-sonnet-20250219

# OpenAI / ChatGPT:
OPENAI_MODEL=gpt-4o
OPENAI_API_BASE=https://api.openai.com/v1

# Google / Gemini (when using Antigravity in an idle worker container):
AGY_PLAN_MODEL=claude-sonnet-4-6
AGY_REVIEW_MODEL=claude-sonnet-4-6
AGY_FALLBACK_MODEL=gemini-3.1-pro-high

# ------------------------------------------------------------------------------
# Execution & Rework Limits
# ------------------------------------------------------------------------------
# Maximum number of rework attempts per task before auto-blocking or replanning
MAX_REWORK=3

# Maximum planning rounds for a goal before auto-closure
MAX_GOAL_ROUNDS=3

# Maximum active parallel goals in progress
MAX_ACTIVE_GOALS=4

# Maximum allowed git diff size in bytes for auto-merging PRs
DIFF_MAX=60000

# Automatically merge branches that pass all review and mutation checks (1=yes, 0=no)
AUTO_MERGE=1

# Main loop tick interval in seconds
LOOP_SEC=20

# Timezone for log formatting (IANA timezone string)
LOCAL_TZ=UTC

# Comma-separated list of files that bypass task file-overlap locks
# (Files where multiple concurrent tasks can append without blocking each other)
SHARED_FILES=

# Autopilot: automatically pick next goals from backlog or vision when workers are idle (1=on, 0=off)
AUTOPILOT=1
