# bin/foreman settings - copy to etc/foreman.conf (KEY=VALUE, '#' comments). Every key is optional; these are the defaults.

# --- Who answers each orchestrator decision, tried left to right -------------------------------------------------------
# Free with subscriptions you already have:
#   claude-cli  - Claude Code (`claude -p`, your Claude subscription; logged in on this machine)
#   agy-claude  - Claude via Antigravity inside a worker container (that worker account's "Claude and GPT" quota)
#   agy-gemini  - Gemini via Antigravity inside a worker container (that worker account's Gemini quota)
# Paid per token (only if listed AND a key is configured, see docs/PROVIDERS.md): anthropic-api, openai-api, gemini-api
PLAN_PROVIDERS=claude-cli,agy-claude,agy-gemini
REVIEW_PROVIDERS=agy-claude,claude-cli,agy-gemini
CLAUDE_MODEL=sonnet
AGY_PLAN_MODEL=claude-sonnet-4-6
AGY_REVIEW_MODEL=claude-sonnet-4-6
AGY_FALLBACK_MODEL=gemini-3.1-pro-high
# ANTHROPIC_MODEL=
# OPENAI_MODEL=
# OPENAI_API_BASE=https://api.openai.com/v1
# GEMINI_MODEL=

# --- The project -------------------------------------------------------------------------------------------------------
# Subdirectory of the repository the team works in ("" = the whole repo); its AGENTS.md is shown to the planner.
PROJECT_DIR=
# Your product vision, read by the planner, the autopilot and `bin/foreman project` (path relative to this directory).
VISION_FILE=docs/vision.md
# Language of goals, notes and questions written for you.
OWNER_LANG=English
LOCAL_TZ=UTC
# Files several tasks may edit at the same time (registries every task appends to); comma-separated.
SHARED_FILES=

# --- Pace and safety ---------------------------------------------------------------------------------------------------
MAX_REWORK=3
MAX_GOAL_ROUNDS=3
MAX_ACTIVE_GOALS=8
TASK_TOKEN_BUDGET=600000
DIFF_MAX=60000
AUTO_MERGE=1
AUTOPILOT=1
LOOP_SEC=20
