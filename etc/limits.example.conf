# ==============================================================================
# Limits Configuration Template (etc/limits.conf)
# Enforced by bin/dispatch and bin/run-supervisor to prevent runaway runs,
# infinite loops, and token exhaustion.
# ==============================================================================

# Wall-clock execution timeout per worker run in minutes
RUN_TIMEOUT_MIN=30
RUN_TIMEOUT_MAX_MIN=45

# Hard token cap per run (input + output tokens combined)
RUN_TOKEN_CAP=1500000

# Daily token budget across all worker runs (UTC day)
DAILY_TOKEN_BUDGET=1000000000000
MAX_RUNS_PER_DAY=1000000

# Maximum concurrent worker runs
MAX_PARALLEL=4

# Quota floor monitoring: refuse dispatch if remaining quota drops below these % thresholds
QUOTA_MODEL_FILTER=Gemini
QUOTA_MIN_5H_PCT=5
QUOTA_MIN_WEEK_PCT=5

# Kill switch trips automatically after this many consecutive non-ok runs
CONSEC_FAIL_TRIP=6

# How often run-supervisor polls timeouts, token caps, and kill switches (in seconds)
POLL_SEC=2

# Default model assigned to worker coding tasks
WORKER_MODEL=gemini-3.8-flash-high
