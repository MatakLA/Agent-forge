# Limits enforced by bin/dispatch and bin/run-supervisor - copy to etc/limits.conf (required: nothing runs without it).

# Wall-clock limit per worker run, minutes (dispatch may lower it, never above the max).
RUN_TIMEOUT_MIN=30
RUN_TIMEOUT_MAX_MIN=45
# Hard token cap per run (input+output); the run is killed when it is reached.
RUN_TOKEN_CAP=1500000
# Per UTC day over all runs. Set very high to let the subscription quota floor below be the real brake.
DAILY_TOKEN_BUDGET=1000000000000
MAX_RUNS_PER_DAY=1000000
# Concurrent runs (one per worker anyway).
MAX_PARALLEL=4
# Refuse to dispatch to a worker whose remaining quota (agy /usage) for this model family is below these percentages.
# If /usage cannot be read, dispatch is refused (fail closed).
QUOTA_MODEL_FILTER=Gemini
QUOTA_MIN_5H_PCT=5
QUOTA_MIN_WEEK_PCT=5
# The kill switch trips automatically after this many non-ok runs in a row (system-wide).
CONSEC_FAIL_TRIP=6
POLL_SEC=2
# Model every worker run uses (see `docker exec worker-1 agy-run models`).
WORKER_MODEL=gemini-3.8-flash-high
