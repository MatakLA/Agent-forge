# Limits enforced by bin/dispatch and bin/run-supervisor (owner-approved 2026-09-26; owner-approved 2026-10-02: 40 runs/day,
# 40M tokens/day, quota floor 5 %/5 % so the workers use up their Antigravity quota before the orchestrator runs out). KEY=VALUE, '#' comments.
# Change values here only with the owner's approval; the orchestrator must not loosen them on its own.

# Wall-clock limit per run in minutes (dispatch's optional 3rd argument may only lower it, never exceed RUN_TIMEOUT_MAX_MIN).
RUN_TIMEOUT_MIN=30
RUN_TIMEOUT_MAX_MIN=45
# Hard token cap per run (input+output, as in agy's usage.total_tokens); the effective cap is min(this, remaining daily budget).
RUN_TOKEN_CAP=1500000
# Per UTC day, over all non-test runs. Effectively unlimited since 2026-10-02 (owner: the Antigravity quota floor below is
# the real brake; workers pause when it is reached and continue after the reset). Per-run caps and the kill switch stay.
DAILY_TOKEN_BUDGET=1000000000000
MAX_RUNS_PER_DAY=1000000
# Concurrent runs across all workers (one per worker anyway). 4 workers since 2026-10-02 (owner-approved, 2 extra paid Antigravity accounts).
MAX_PARALLEL=4
# Refuse to dispatch when the remaining quota (per `agy /usage`) of the monitored model family is below these percentages.
# If /usage cannot be read or parsed, dispatch is refused (fail closed).
QUOTA_MODEL_FILTER=Gemini
QUOTA_MIN_5H_PCT=5
QUOTA_MIN_WEEK_PCT=5
# Kill switch trips automatically after this many non-ok runs in a row (system-wide, across all workers).
# Raised from 3 (2026-10-03, host judgment call per owner delegation): with 4 workers running nonstop and a
# rework loop, token-cap/setup-failed/occasional-fail runs are normal operational churn, not a sign of systemic
# breakage, and 3-in-a-row was tripping on ordinary bad luck across workers. Still low enough to catch a genuinely
# broken image/network quickly.
CONSEC_FAIL_TRIP=6
# How often the supervisor checks timeout / token cap / kill switch.
POLL_SEC=2

# Model slug (see `agy models`) every worker run dispatches with; owner request 2026-09-30: high
# effort/reasoning variants for routine dev work, not low/medium (Claude reviews/merges, workers implement).
WORKER_MODEL=gemini-3.8-flash-high
