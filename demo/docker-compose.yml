# ==============================================================================
# Agent-Forge Demo Mode Docker Compose Configuration
# Runs the Agent-Forge dashboard against synthetic state.
# Exactly one service (demo), offline execution, zero credentials required.
# ==============================================================================
name: demo

services:
  demo:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    image: agent-forge-demo:1
    restart: unless-stopped
    # loopback only: a bare "8171:8171" listens on every interface, and Docker publishes around the host firewall
    ports:
      - "127.0.0.1:8171:8171"
    environment:
      - DEMO_MODE=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8171/api/status')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
