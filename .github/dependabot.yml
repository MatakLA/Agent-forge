version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /demo
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: monthly
    ignore:
      - dependency-name: sandbox-worker   # built locally by Dockerfile, not published to any registry
  - package-ecosystem: docker
    directory: /egress
    schedule:
      interval: monthly
