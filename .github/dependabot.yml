version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /demo
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: monthly
    ignore:
      - dependency-name: sandbox-worker   # built locally by Dockerfile, not published to any registry
  - package-ecosystem: docker
    directory: /egress
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /worker/agent-clis
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /tests/node/a11y
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests/node/ui
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tests/node/props
    schedule:
      interval: monthly
    groups:
      test-tools:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    groups:
      ci-tools:
        patterns: ["*"]
