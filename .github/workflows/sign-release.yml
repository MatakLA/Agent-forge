# Attach the source archive, SHA256SUMS and Sigstore signatures (tools/sign-release) to a release that was published without them, or
# repeat that step if the release workflow stopped half way. Run by hand from main: Actions -> sign-release -> Run workflow -> tag.
# Files that are already on the release (the SBOM) are signed too; the archive and SHA256SUMS are rebuilt from the tagged commit.
name: sign-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.12.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sign-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload the files to the existing release
      id-token: write       # keyless signing (Sigstore)
      attestations: write   # store the signed build provenance
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
          path: src
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: The tag is a release of this repository
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$TAG is not a release tag like v1.2.3"; exit 1 ;; esac
          [ "$(cat src/VERSION)" = "${TAG#v}" ] || { echo "::error::$TAG does not match its VERSION file"; exit 1; }
          gh release view "$TAG" >/dev/null
      - name: Sign the release files
        run: |
          shopt -s nullglob          # a release without files (v0.12.0) has nothing in existing/
          mkdir existing
          if [ "$(gh release view "$TAG" --json assets --jq '.assets | length')" -gt 0 ]; then gh release download "$TAG" --dir existing; fi
          # what this step makes again, and the old signatures
          rm -f existing/SHA256SUMS existing/agent-forge-*.tar.gz existing/*.sigstore.json
          SRC_DIR=src tools/sign-release "${TAG#v}" signed existing/*
      - name: Signed build provenance of the files (verify with gh attestation verify FILE --owner MatakLA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            signed/agent-forge-*.tar.gz
            signed/*.spdx.json
          create-storage-record: false
      - name: Upload to the release
        run: gh release upload "$TAG" signed/* --clobber
