# Runs on GitHub Actions and on Gitea/Forgejo Actions (same syntax). Fast checks only: no Docker, no model calls.
name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fast checks
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log
      - name: Step summary on failure
        if: failure()
        run: |
          echo "### ❌ CI Check Failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 check.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
