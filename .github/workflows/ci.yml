# Runs on GitHub Actions and on Gitea/Forgejo Actions (same syntax). Fast checks only: no Docker, no model calls.
name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
