# Runs on GitHub Actions and on Gitea/Forgejo Actions (same syntax). Fast checks only: no model calls, no accounts.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pyflakes (shellcheck is preinstalled on the runner)
        run: python -m pip install --quiet pyflakes
      - name: shellcheck + pyflakes
        run: tools/lint

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fast checks (make check)
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log
      - name: Step summary on failure
        if: failure()
        run: |
          echo "::error title=make check failed::$(grep -vE '^[.s]*$' check.log | tail -n 12 | tr '\n' '|')"
          {
            echo "### make check failed (Python ${{ matrix.python-version }})"
            echo '```'
            tail -n 80 check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  demo-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the demo image and ask it for its health
        run: |
          docker build -f demo/Dockerfile -t agent-forge-demo:ci .
          docker run -d --name demo -p 127.0.0.1:8171:8171 agent-forge-demo:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8171/healthz && break; sleep 2; done
          # the first status poll takes a few seconds; the demo must then show goals, not an error
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8171/api/status | grep -q '"foreman": {' && break; sleep 2; done
          curl -fsS http://127.0.0.1:8171/api/status | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d.get("error") is None and d.get("foreman"), d
          assert d["foreman"]["goals"], "the demo shows no goals"
          print("demo ok:", len(d["foreman"]["goals"]), "goals")'
      - name: The image holds no private files
        run: |
          docker run --rm --entrypoint sh agent-forge-demo:ci -c '
            ls -a /app | head -50
            for p in .git .env etc/foreman.conf etc/forge.conf runs projects; do
              [ ! -e "/app/$p" ] || { echo "unexpected /app/$p in the image"; exit 1; }
            done'
      - name: Logs on failure
        if: failure()
        run: docker logs demo || true
