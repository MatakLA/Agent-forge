# Does the Python side (the foreman, the dashboard backend and their tests) still run outside Linux? Not a required check:
# Agent-Forge itself needs Linux (systemd, Docker). This guards the list in tests/portable-python.txt, so a Mac contributor can run
# the unit tests and a change that breaks them there shows up. Windows: only a handful of tests run natively (use WSL2).
name: portability
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast-checks:
    name: python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: The pure-Python tests that are known to pass on this OS (tests/portable-python.txt)
        run: python tests/run_portable.py
