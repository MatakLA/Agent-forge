# How much of the Python code do the fast tests (`make check`) execute? Measured on every push to main; the number feeds the README badge.
# Honest limits: only code the fast checks reach (no Docker, no model calls), and only paths under this checkout.
name: coverage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install --quiet --require-hashes -r tools/requirements-coverage.txt
      - name: make check under coverage (child processes included)
        run: |
          cat > "$RUNNER_TEMP/coveragerc" <<RC
          [run]
          parallel = True
          sigterm = True
          source = $PWD/bin, $PWD/web, $PWD/worker, $PWD/scripts, $PWD/egress
          omit = */tests/*
          data_file = $PWD/.coverage
          RC
          sp=$(python -c 'import site; print(site.getsitepackages()[0])')
          echo 'import coverage; coverage.process_startup()' > "$sp/zz_coverage.pth"
          COVERAGE_PROCESS_START="$RUNNER_TEMP/coveragerc" make check
      - name: Report
        run: |
          rc="$RUNNER_TEMP/coveragerc"
          python -m coverage combine --rcfile="$rc"
          # also count the Python scripts without a .py name that no test ran (a script nobody runs is not "covered")
          mapfile -t files < <(git ls-files 'bin/*' 'web/*' 'worker/*' 'scripts/*' 'egress/*' | while read -r f; do
            case "$f" in *.py) echo "$f" ;; *.*) ;; *) if head -n 1 "$f" | grep -q '^#!.*python'; then echo "$f"; fi ;; esac
          done)
          python -m coverage report --rcfile="$rc" --skip-empty "${files[@]}" | tee report.txt
          python -m coverage json --rcfile="$rc" -o coverage.json "${files[@]}"
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          t = json.load(open("coverage.json"))["totals"]
          pct = t["percent_covered"]
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else "yellowgreen" if pct >= 70 else "yellow" if pct >= 60 else "orange"
          json.dump({"schemaVersion": 1, "label": "python coverage", "message": "%d %%" % round(pct), "color": color}, open("badge.json", "w"))
          print("### Python line coverage of `make check`: **%.1f %%** (%d of %d lines)" % (pct, t["covered_lines"], t["num_statements"]))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            report.txt
            coverage.json
            badge.json

  # The README badge reads badge.json from the data-only `badges` branch (shields.io endpoint format).
  badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # push badge.json to the badges branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Publish the badge data
        run: |
          mkdir "$RUNNER_TEMP/badges"
          cp badge.json "$RUNNER_TEMP/badges/coverage.json"
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Python coverage of $GITHUB_SHA"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GH_TOKEN: ${{ github.token }}
