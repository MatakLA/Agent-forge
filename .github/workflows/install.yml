# A fresh install exactly as a new user does it - on a brand-new GitHub runner VM (Ubuntu, Docker, systemd, sudo), every push.
# Then: the services answer, a worker container can be created, bin/doctor is happy, and the integration tests of the
# supervisor, of the real agent CLIs (against a fake model API - no keys, no cost) and of the dashboard page pass. A first green run is the proof
# that `scripts/install.sh` works for someone who is not us.
name: install
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"          # weekly: catches upstream breakage (images, CLIs, package mirrors)
  pull_request:
    paths:                        # changes to the installer get the real fresh-install proof before they merge
      - install.sh
      - forge
      - scripts/install.sh
      - scripts/update.sh
      - scripts/uninstall.sh
      - scripts/vm-baseline-ubuntu.sh
      - scripts/install-services
      - .github/workflows/install.yml
permissions:
  contents: read
concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fresh-install:
    name: fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install from scratch, as a user would
        run: |
          set -o pipefail
          sudo systemctl start docker || true
          ./forge install --demo 2>&1 | tee install.log
      - name: Summary on failure
        if: failure()
        run: |
          echo "=== INSTALL FAILURE LOG ==="
          cat install.log || true
          ERR_MSG=$(tail -n 15 install.log 2>/dev/null | tr '\n' ' ' || echo "install failed")
          echo "::error file=scripts/install.sh::$ERR_MSG"
          {
            echo "### ❌ Install Workflow Failed"
            echo '```'
            tail -n 80 install.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: The services run and answer
        run: |
          systemctl is-active agent-forge-foreman agent-forge-web
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8171/healthz && break; sleep 2; done
          for _ in $(seq 1 30); do [ -f runs/foreman/live.json ] && break; sleep 2; done
          python3 bin/foreman status
      - name: A worker container can be created (it stays logged out - no accounts in CI)
        run: |
          if [ "$(uname -m)" = x86_64 ]; then
            bin/worker-add 1
          else
            # agy workers are x86-64 only (bin/worker-add refuses them): build the agy worker image anyway - the supervisor test
            # below runs a fake agent in it - and create a worker with an API runtime
            WORKER_N=0 docker compose -f worker/docker-compose.yml build
            printf none | bin/secret-set anthropic.key
            bin/worker-add 1 --runtime claude
          fi
      - name: Health check (exit 1 = warnings only, e.g. no notifications configured)
        run: |
          rc=0
          python3 bin/doctor --quick > doctor.log 2>&1 || rc=$?
          cat doctor.log
          if [ "$rc" -ge 2 ]; then
            echo "::error title=bin/doctor reported problems::$(grep -E '✘' doctor.log | head -n 8 | tr '\n' '|')"
          fi
          [ "$rc" -le 1 ]
      - name: Supervisor integration test (a fake agent in the real worker image)
        run: tests/test_supervisor.sh
      - name: API runtimes - the real Claude Code, Codex and Gemini CLIs against a fake model API
        env: {WORKER_N: "0", WORKER_RUNTIME: claude, WORKER_KEY_FILE: none}
        run: |
          docker compose -f worker/docker-compose.api.yml build
          tests/test_runtimes.sh
      - name: The dashboard page in a real DOM (every tab and sheet, no script errors)
        run: tests/test_ui.sh
      - name: Dashboard accessibility - axe-core in headless Chromium (light and dark), keyboard, focus, reduced motion, reflow
        run: tests/test_a11y.sh
      - name: forge url works on the fresh install
        run: ./forge url
      - name: Uninstall removes services and containers but keeps the data
        run: |
          ./forge uninstall --yes
          for unit in agent-forge-foreman agent-forge-web; do
            if systemctl is-active --quiet "$unit"; then echo "::error::$unit is still running after the uninstall"; exit 1; fi
          done
          left="$(docker ps -a --format '{{.Names}}' | grep -E '^(egress-proxy|forgejo|worker-[0-9]+)$' || true)"
          if [ -n "$left" ]; then echo "::error::containers left after the uninstall: $left"; exit 1; fi
          test -f etc/foreman.conf
          test -d "$HOME/.config/sandbox/secrets"
      - name: Uninstall --purge deletes the data too
        run: |
          ./forge uninstall --purge --yes
          test ! -f etc/foreman.conf
          test ! -d "$HOME/.config/sandbox/secrets"
          test -z "$(docker volume ls --format '{{.Name}}' | grep -E '^(worker_worker-[0-9]+-home|egress_logs|forgejo_forgejo-data)$')"
      - name: Logs on failure
        if: failure()
        run: |
          sudo journalctl -u agent-forge-foreman -u agent-forge-web --no-pager | tail -100 || true
          docker ps -a || true
