# Push a tag vX.Y.Z (see CONTRIBUTING.md, "Releases") to: check that the tag matches VERSION and CHANGELOG, run the fast checks,
# publish the demo image to ghcr.io/matakla/agent-forge-demo with an SBOM and signed build provenance, and create the GitHub release
# from the CHANGELOG section with the source archive, the SBOM and SHA256SUMS attached, each signed keyless with Sigstore
# (tools/sign-release; NAME.sigstore.json files) and covered by signed build provenance.
# Run by hand from a branch (workflow_dispatch) it only rehearses: it builds both platforms with SBOM and provenance enabled and
# pushes nothing and releases nothing; it signs a throwaway archive to prove that the signing and its check work.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag matches VERSION and the CHANGELOG has a section for it
        id: v
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$(cat VERSION)" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($(cat VERSION))"; exit 1; }
          grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: make check

  demo-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless signing of the provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/matakla/agent-forge-demo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Agent-Forge demo
            org.opencontainers.image.description=The Agent-Forge dashboard on invented data - nothing to configure
            org.opencontainers.image.licenses=Apache-2.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: demo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true              # an SPDX bill of materials stored with the image
          provenance: mode=max    # how it was built, from which commit
      - name: Signed build provenance (verify with gh attestation verify)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/matakla/agent-forge-demo
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  signing-rehearsal:
    if: github.ref_type != 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # keyless signing (Sigstore): the rehearsal signs a throwaway archive of this branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: tools/sign-release "$(cat VERSION)" "$RUNNER_TEMP/signed"

  github-release:
    needs: [verify, demo-image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release and upload its files
      id-token: write       # keyless signing of those files (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release notes from the CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty release notes"; exit 1; }
          {
            echo
            echo "Try it without installing anything: \`docker run --rm -p 127.0.0.1:8171:8171 ghcr.io/matakla/agent-forge-demo:$VERSION\`"
            echo
            echo "Check where the image came from: \`gh attestation verify oci://ghcr.io/matakla/agent-forge-demo:$VERSION --owner MatakLA\` (signed build provenance)."
            echo "The source archive, the SPDX bill of materials and SHA256SUMS are attached, each with a Sigstore signature (\`.sigstore.json\`): see \"What you download\" in SECURITY.md."
          } >> notes.md
      - name: SBOM of the published image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/matakla/agent-forge-demo:${{ needs.verify.outputs.version }}
          format: spdx-json
          output-file: agent-forge-demo-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Source archive, SHA256SUMS and their Sigstore signatures
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: tools/sign-release "$VERSION" signed agent-forge-demo-sbom.spdx.json
      - name: Signed build provenance of the files (verify with gh attestation verify FILE --owner MatakLA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            signed/agent-forge-*.tar.gz
            signed/agent-forge-demo-sbom.spdx.json
          create-storage-record: false
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Agent-Forge $GITHUB_REF_NAME" --notes-file notes.md --verify-tag signed/*
