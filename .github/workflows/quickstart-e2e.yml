# Quickstart end-to-end check: runs the example sample-project walkthrough offline.
# No real Docker service is needed (the script uses tools/fake-docker).
name: quickstart-e2e

on:
  workflow_dispatch:
  push:
    paths:
      - "tests/test_quickstart_e2e.sh"
      - "tests/fixtures/quickstart_budget.py"
      - "scripts/quickstart-e2e-setup.sh"
      - "examples/sample-project/**"
  pull_request:
    paths:
      - "tests/test_quickstart_e2e.sh"
      - "tests/fixtures/quickstart_budget.py"
      - "scripts/quickstart-e2e-setup.sh"
      - "examples/sample-project/**"

permissions:
  contents: read

concurrency:
  group: quickstart-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quickstart-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: bash tests/test_quickstart_e2e.sh
