# Agent-Forge issue template: Security Audit (GitHub Issue Form)
#
# Grounding in bin/issues-intake:
# - Label matching: bin/issues-intake polls upstream issues with label 'agent-forge' (default: --label agent-forge).
#   The 'agent-forge' label is read and required by bin/issues-intake.
#   The 'security' label is not a filter and is not read by bin/issues-intake; it only helps people sort the issue list.
# - Goal generation: bin/issues-intake does not parse or extract individual body section names.
#   It strips HTML tags (<[^>]+>), concatenates "{clean_title}\n\n{clean_body}", truncates the total string
#   to 4000 characters, and passes it directly to `bin/foreman goal -` via stdin.
#   All body sections below are flagged as human-only hints to guide reporters in providing structured,
#   actionable security audit requests for Foreman's AI planner.
# - Roles and safety:
#   A security-audit goal is picked up by the `security-tester`/`security-developer` roles and no real exploit against anything outside this repository should ever be pasted into the issue (per SECURITY.md).

name: "Security audit"
description: "File a security audit goal for Agent-Forge to inspect and harden"
title: "[Security Audit]: "
labels:
  # Read by bin/issues-intake (default issue filter label):
  - "agent-forge"
  # Triage label for people (not a filter, not read by bin/issues-intake):
  - "security"
body:
  - type: markdown
    attributes:
      value: |
        A security-audit goal is picked up by the `security-tester`/`security-developer` roles and no real exploit against anything outside this repository should ever be pasted into the issue (per SECURITY.md).
        Never paste real secrets, production credentials, or live exploit payloads into the issue.
  - type: textarea
    id: component-or-module
    attributes:
      label: "Component or module"
      description: "Human-only hint (bin/issues-intake does not read this section name; it forwards the full body into the goal text): Which file, command, or module should be audited?"
      placeholder: "e.g., bin/foreman, bin/issues-intake, web/dashboard/, egress/"
    validations:
      required: true
  - type: textarea
    id: suspected-concern
    attributes:
      label: "Suspected concern"
      description: "Human-only hint (bin/issues-intake does not read this section name): Describe the suspected or known security concern, boundary weakness, or threat model question to investigate. Warning: Do not paste real exploits or secrets."
      placeholder: "Describe what might be vulnerable, injection surface, boundary issue, or unescaped parameter..."
    validations:
      required: true
  - type: textarea
    id: severity-guess
    attributes:
      label: "Rough severity guess"
      description: "Human-only hint (bin/issues-intake does not read this section name): Rough severity estimate for maintainer and agent triage (e.g., Low, Medium, High, or Critical)."
      placeholder: "e.g., Medium (internal boundary or error leaking info, no external exposure)"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Human-only hint (bin/issues-intake does not read this section name): Constraints, reproduction hints, or relevant references. Note: bin/issues-intake strips HTML tags and truncates total goal text (title + body) to 4000 characters. Never paste real secrets or exploits."
      placeholder: "Any additional notes or references. Keep concise (total body + title under 4000 chars)."
    validations:
      required: false
